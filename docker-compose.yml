services:
  backend:
    build: ./backend
    container_name: ctf-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/ctf.db:/app/ctf.db
      - /var/run/docker.sock:/var/run/docker.sock   # 允许后端拉起题目容器

  frontend:
    build: ./frontend
    container_name: ctf-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
